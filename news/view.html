<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">تفاصيل الخبر - الاتحاد العربي للملكية الفكرية</title>
  <meta name="description" id="metaDescription" content="تفاصيل الخبر من الاتحاد العربي لحماية حقوق الملكية الفكرية.">
  <link rel="canonical" id="canonicalLink" href="https://auipr.org/news/view.html">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="article">
  <meta property="og:title" id="ogTitle" content="تفاصيل الخبر - الاتحاد العربي للملكية الفكرية">
  <meta property="og:description" id="ogDescription" content="تفاصيل وتغطية الخبر من الاتحاد العربي لحماية حقوق الملكية الفكرية.">
  <meta property="og:image" id="ogImage" content="https://static.wixstatic.com/media/215eb2_98e65620ebb04f4d96de0b8ae685fcee~mv2.png">
  <meta property="og:url" id="ogUrl" content="https://auipr.org/news/view.html">
  <meta property="og:site_name" content="الاتحاد العربي للملكية الفكرية">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="تفاصيل الخبر - الاتحاد العربي للملكية الفكرية">
  <meta name="twitter:description" id="twDescription" content="تفاصيل وتغطية الخبر من الاتحاد العربي لحماية حقوق الملكية الفكرية.">
  <meta name="twitter:image" id="twImage" content="https://static.wixstatic.com/media/215eb2_98e65620ebb04f4d96de0b8ae685fcee~mv2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="news-hero" id="newsHero" style="background-image:url('../img/ip_conference_2026.png');">
      <div class="hero-overlay"></div>
      <div class="container hero-content">
        <span class="news-category" id="newsCategory">أخبار الاتحاد</span>
        <h1 class="news-main-title" id="newsTitle">جاري تحميل الخبر...</h1>
        <div class="news-meta" id="newsMeta"></div>
      </div>
    </section>

    <section class="news-body-content container">
      <div class="article-container">
        <div class="article-text">
          <div id="articleImageWrapper" style="display:none; text-align: center; margin-top: 15px; margin-bottom: 30px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 650px; margin-left: auto; margin-right: auto;">
            <img id="articleFeaturedImg" src="" alt="" style="width: 100%; height: auto; display: block; object-fit: cover; max-height: 450px;">
          </div>
          <p class="lead-text" id="newsSummary"></p>
          <div id="newsFullContent" style="font-size: 1.05rem; line-height: 1.8; color: #334155; white-space: pre-line;"></div>
        </div>

        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
          <a href="index.html" class="news-action-btn" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; color: #1a2b4b;">
            <span>→</span> العودة لجميع الأخبار
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../js/main.js"></script>

  <script>
    async function loadSingleNews() {
      const urlParams = new URLSearchParams(window.location.search);
      let slug = urlParams.get('slug');
      const id = urlParams.get('id');

      if (!slug && !id) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const lastSegment = pathSegments[pathSegments.length - 1];
        if (lastSegment && lastSegment !== 'view.html' && lastSegment !== 'index.html') {
          slug = lastSegment;
        }
      }

      if (!slug && !id) {
        document.getElementById('newsTitle').innerText = 'لم يتم العثور على الخبر';
        document.getElementById('newsSummary').innerText = 'يرجى العودة إلى صفحة الأخبار واختيار خبر صحيح.';
        return;
      }

      const query = slug ? `slug=${encodeURIComponent(slug)}` : `id=${encodeURIComponent(id)}`;

      try {
        const res = await fetch(`/.netlify/functions/news?${query}`);
        if (!res.ok) throw new Error('News not found');
        const item = await res.json();

        // Populate elements
        document.getElementById('pageTitle').innerText = `${item.title} - الاتحاد العربي للملكية الفكرية`;
        document.getElementById('newsTitle').innerText = item.title;
        document.getElementById('newsCategory').innerText = item.category || 'أخبار الاتحاد';
        if (item.date) {
          document.getElementById('newsMeta').innerHTML = `<time><i class="fa-regular fa-calendar"></i> ${item.date}</time>`;
        }
        document.getElementById('newsSummary').innerText = item.summary || '';
        document.getElementById('newsFullContent').innerText = item.content || '';

        if (item.imageUrl) {
          document.getElementById('newsHero').style.backgroundImage = `url('${item.imageUrl}')`;
          const featuredImg = document.getElementById('articleFeaturedImg');
          const imgWrapper = document.getElementById('articleImageWrapper');
          if (featuredImg && imgWrapper) {
            featuredImg.src = item.imageUrl;
            featuredImg.alt = item.title;
            imgWrapper.style.display = 'block';
          }
        }

        // Dynamic SEO & Open Graph Updates
        if (item.summary) {
          const cleanDesc = item.summary.substring(0, 160);
          document.getElementById('metaDescription').setAttribute('content', cleanDesc);
          document.getElementById('ogDescription').setAttribute('content', cleanDesc);
          document.getElementById('twDescription').setAttribute('content', cleanDesc);
        }
        document.getElementById('ogTitle').setAttribute('content', item.title);
        document.getElementById('twTitle').setAttribute('content', item.title);
        document.getElementById('canonicalLink').setAttribute('href', window.location.href);
        document.getElementById('ogUrl').setAttribute('content', window.location.href);

        if (item.imageUrl && !item.imageUrl.startsWith('data:')) {
          document.getElementById('ogImage').setAttribute('content', item.imageUrl);
          document.getElementById('twImage').setAttribute('content', item.imageUrl);
        }

        // Inject Schema.org JSON-LD NewsArticle
        const schemaData = {
          "@context": "https://schema.org",
          "@type": "NewsArticle",
          "headline": item.title,
          "description": item.summary || "",
          "image": [item.imageUrl && !item.imageUrl.startsWith('data:') ? item.imageUrl : "https://static.wixstatic.com/media/215eb2_98e65620ebb04f4d96de0b8ae685fcee~mv2.png"],
          "datePublished": item.date || new Date().toISOString().split('T')[0],
          "author": {
            "@type": "Organization",
            "name": "الاتحاد العربي لحماية حقوق الملكية الفكرية",
            "url": "https://auipr.org"
          },
          "publisher": {
            "@type": "Organization",
            "name": "الاتحاد العربي لحماية حقوق الملكية الفكرية",
            "logo": {
              "@type": "ImageObject",
              "url": "https://static.wixstatic.com/media/215eb2_98e65620ebb04f4d96de0b8ae685fcee~mv2.png"
            }
          }
        };

        const scriptTag = document.createElement('script');
        scriptTag.type = 'application/ld+json';
        scriptTag.textContent = JSON.stringify(schemaData);
        document.head.appendChild(scriptTag);
      } catch (err) {
        console.error('Error loading news item:', err);
        document.getElementById('newsTitle').innerText = 'تعذر تحميل الخبر';
        document.getElementById('newsSummary').innerText = 'حدث خطأ أثناء جلب تفاصيل الخبر من قاعدة البيانات.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadSingleNews);
  </script>
</body>
</html>
